<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Додати відео — Відео Академія</title>

    <style>
        :root {
            --primary: #2563eb;
            --dark: #1e293b;
            --light: #f8fafc;
            --border: #e2e8f0;
            --muted: #64748b;
            --ok: #16a34a;
            --err: #dc2626;
        }
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            background: var(--light);
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            padding: 28px 24px;
            max-width: 480px;
            width: calc(100% - 32px);
            margin: 16px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .video-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--dark);
            word-wrap: break-word;
            margin: 0 0 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }
        .video-title:empty { display: none; }

        .crumb {
            font-size: 0.85rem;
            color: var(--muted);
            margin: 0 0 16px;
        }
        .crumb strong { color: var(--dark); }

        .list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
            flex-grow: 1;
            margin: 0 -4px 16px;
            padding: 0 4px;
        }

        .item-btn {
            padding: 16px 18px;
            border: 2px solid var(--border);
            background: white;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s;
            font-family: inherit;
            color: var(--dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }
        .item-btn:hover {
            border-color: var(--primary);
        }
        .item-btn.active {
            border-color: var(--primary);
            background: #eff6ff;
            color: var(--primary);
        }
        .item-btn .check {
            color: var(--primary);
            font-weight: 700;
        }
        .item-btn .count {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 400;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .btn {
            padding: 16px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.15s;
            font-family: inherit;
            flex: 1;
        }
        .btn:hover:not(:disabled) { opacity: 0.9; }
        .btn:disabled {
            background: #cbd5e1;
            cursor: not-allowed;
        }
        .btn.secondary {
            background: white;
            color: var(--dark);
            border: 2px solid var(--border);
            flex: 0 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }
        .btn.secondary:hover { border-color: var(--primary); color: var(--primary); }

        .token-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .token-form label {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.5;
        }
        .token-form input {
            padding: 14px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
            font-family: ui-monospace, monospace;
        }
        .token-form input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .token-form button {
            padding: 14px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        .success {
            text-align: center;
            padding: 40px 20px;
        }
        .success .check {
            font-size: 4rem;
            color: var(--ok);
            margin-bottom: 12px;
        }
        .success .msg {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status {
            font-size: 0.9rem;
            color: var(--muted);
            margin-top: 12px;
            text-align: center;
            min-height: 1.2em;
        }
        .status.error { color: var(--err); }
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="status">Завантаження…</div>
</div>

<script src="js/github-api.js"></script>
<script>
/* ═══════════════════════════════════════════════════════════
   add.html
   Додавання відео з YouTube у каталог.
   Крок 1: обрати альбом.
   Крок 2: обрати розділ (за замовчуванням "00 Нерозподілені").
   Крок 3: зберегти.
   ═══════════════════════════════════════════════════════════ */

const UNDISTRIBUTED = '00 Нерозподілені';
const ALBUMS_FILE = 'data/albums.json';

let videoUrl = '';
let videoTitle = '';
let albums = [];           // [{id, title, file}, ...]
let selectedAlbum = null;  // об'єкт альбому
let sections = [];         // [{name, count}, ...]
let selectedSection = UNDISTRIBUTED;

/* ═══════════════════════════════════════════════════════════
   УТИЛІТИ
   ═══════════════════════════════════════════════════════════ */

function getParam(name) {
    return new URLSearchParams(location.search).get(name);
}

function extractYouTubeId(url) {
    if (!url || typeof url !== 'string') return null;
    let u = url.trim();
    const patterns = [
        /youtu\.be\/([A-Za-z0-9_-]{11})/,
        /\/shorts\/([A-Za-z0-9_-]{11})/,
        /\/embed\/([A-Za-z0-9_-]{11})/,
        /\/live\/([A-Za-z0-9_-]{11})/,
        /[?&]v=([A-Za-z0-9_-]{11})/
    ];
    for (const pat of patterns) {
        const m = u.match(pat);
        if (m) return m[1];
    }
    return null;
}

function setStatus(msg, isError = false) {
    const el = document.querySelector('.status');
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('error', isError);
}

async function fetchVideoTitle(videoId) {
    try {
        const res = await fetch('https://noembed.com/embed?url=https://www.youtube.com/watch?v=' + videoId);
        if (!res.ok) return '';
        const data = await res.json();
        return data.title || '';
    } catch (e) {
        return '';
    }
}

/* ═══════════════════════════════════════════════════════════
   ЕКРАН 1: ФОРМА ТОКЕНА
   ═══════════════════════════════════════════════════════════ */

function renderTokenForm() {
    const card = document.getElementById('card');
    card.innerHTML = `
        <h1 style="font-size:1.1rem;margin:0 0 20px;">Налаштування</h1>
        <div class="token-form">
            <label>Для збереження відео потрібен токен GitHub. Він зберігається тільки на цьому пристрої.</label>
            <input type="password" id="token-input" placeholder="ghp_..." autocomplete="off">
            <button type="button" id="token-save">Зберегти токен</button>
            <div class="status"></div>
        </div>
    `;

    document.getElementById('token-save').addEventListener('click', async () => {
        const token = document.getElementById('token-input').value.trim();
        if (!token) { setStatus('Введіть токен', true); return; }
        setStatus('Перевірка…');
        GitHubAPI.setToken(token);
        const ok = await GitHubAPI.checkToken();
        if (ok) {
            setStatus('✅ Токен працює');
            setTimeout(() => startAfterToken(), 500);
        } else {
            GitHubAPI.forgetToken();
            setStatus('❌ Токен невірний або немає прав', true);
        }
    });
}

/* ═══════════════════════════════════════════════════════════
   ЕКРАН 2: СПИСОК АЛЬБОМІВ
   ═══════════════════════════════════════════════════════════ */

async function renderAlbumsScreen() {
    const card = document.getElementById('card');
    card.innerHTML = `
        <div class="video-title">${videoTitle || 'Нове відео'}</div>
        <div class="crumb">Оберіть альбом:</div>
        <div class="list" id="list"></div>
        <div class="status"></div>
    `;

    // Читаємо список альбомів
    try {
        setStatus('Завантаження альбомів…');
        const text = await GitHubAPI.readFileViaFetch(ALBUMS_FILE);
        if (!text) throw new Error('albums.json не знайдено');
        albums = JSON.parse(text);
        if (!Array.isArray(albums)) albums = [];
    } catch (e) {
        setStatus('Помилка: ' + e.message, true);
        return;
    }

    setStatus('');

    const list = document.getElementById('list');
    albums.forEach(album => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'item-btn';
        btn.innerHTML = `<span>${album.title}</span>`;
        btn.addEventListener('click', () => {
            selectedAlbum = album;
            renderSectionsScreen();
        });
        list.appendChild(btn);
    });
}

/* ═══════════════════════════════════════════════════════════
   ЕКРАН 3: СПИСОК РОЗДІЛІВ
   ═══════════════════════════════════════════════════════════ */

async function renderSectionsScreen() {
    const card = document.getElementById('card');
    card.innerHTML = `
        <div class="video-title">${videoTitle || 'Нове відео'}</div>
        <div class="crumb">Альбом: <strong>${selectedAlbum.title}</strong></div>
        <div class="crumb">Оберіть розділ:</div>
        <div class="list" id="list"></div>
        <div class="actions">
            <button type="button" class="btn secondary" id="back-btn">← Назад</button>
            <button type="button" class="btn" id="save-btn">💾 Зберегти</button>
        </div>
        <div class="status"></div>
    `;

    // Читаємо файл альбому, щоб зібрати унікальні розділи
    try {
        setStatus('Завантаження розділів…');
        const text = await GitHubAPI.readFileViaFetch('data/' + selectedAlbum.file);
        let videos = [];
        if (text) {
            videos = JSON.parse(text);
            if (!Array.isArray(videos)) videos = [];
        }
        sections = buildSections(videos);
    } catch (e) {
        // Якщо файл не існує — це нормально, розділів ще немає
        sections = [];
    }

    setStatus('');

    const list = document.getElementById('list');
    list.innerHTML = '';

    // "00 Нерозподілені" — завжди перший, за замовчуванням
    const undistributed = { name: UNDISTRIBUTED, count: 0, isVirtual: true };
    const existing = sections.find(s => s.name === UNDISTRIBUTED);
    if (existing) undistributed.count = existing.count;

    renderSectionBtn(list, undistributed, true);

    // Решта розділів
    sections
        .filter(s => s.name !== UNDISTRIBUTED)
        .forEach(sec => renderSectionBtn(list, sec, false));

    // Кнопка "Назад"
    document.getElementById('back-btn').addEventListener('click', () => {
        selectedAlbum = null;
        selectedSection = UNDISTRIBUTED;
        renderAlbumsScreen();
    });

    // Кнопка "Зберегти"
    document.getElementById('save-btn').addEventListener('click', doSave);
}

function buildSections(videos) {
    const counts = {};
    videos.forEach(v => {
        const s = v.section || UNDISTRIBUTED;
        counts[s] = (counts[s] || 0) + 1;
    });
    return Object.keys(counts)
        .sort((a, b) => a.localeCompare(b, 'uk'))
        .map(name => ({ name, count: counts[name] }));
}

function renderSectionBtn(container, section, isDefault) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'item-btn';
    if (isDefault && selectedSection === section.name) btn.classList.add('active');

    const countText = section.count > 0 ? `<span class="count">${section.count}</span>` : '';
    btn.innerHTML = `<span>${section.name}</span>${countText}`;

    if (selectedSection === section.name) {
        btn.innerHTML = `<span>${section.name}</span><span class="check">✓</span>`;
    }

    btn.addEventListener('click', () => {
        selectedSection = section.name;
        document.querySelectorAll('.item-btn').forEach(b => {
            b.classList.remove('active');
            // Прибираємо галочку з усіх
            const check = b.querySelector('.check');
            if (check) check.remove();
        });
        btn.classList.add('active');
        btn.innerHTML = `<span>${section.name}</span><span class="check">✓</span>`;
    });

    container.appendChild(btn);
}

/* ═══════════════════════════════════════════════════════════
   ЗБЕРЕЖЕННЯ
   ═══════════════════════════════════════════════════════════ */

async function doSave() {
    if (!selectedAlbum) return;

    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    saveBtn.textContent = '💾 Збереження…';
    setStatus('');

    try {
        const albumFile = selectedAlbum.file;
        const repoPath = 'data/' + albumFile;

        const existingText = await GitHubAPI.readFileViaFetch(repoPath);
        let videos = existingText ? JSON.parse(existingText) : [];
        if (!Array.isArray(videos)) videos = [];

        const newId = extractYouTubeId(videoUrl);
        if (!newId) throw new Error('Некоректне посилання на YouTube');

        const exists = videos.some(v => {
            const vid = extractYouTubeId(v.url);
            return vid && vid === newId;
        });
        if (exists) {
            setStatus('⚠ Це відео вже є в каталозі', true);
            saveBtn.disabled = false;
            saveBtn.textContent = '💾 Зберегти';
            return;
        }

        videos.push({
            title: videoTitle || 'Без назви',
            section: selectedSection,
            url: 'https://www.youtube.com/watch?v=' + newId
        });

        const content = JSON.stringify(videos, null, 2);
        await GitHubAPI.writeFile(repoPath, content, `Add video to ${albumFile}`);

        renderSuccess();

    } catch (err) {
        console.error(err);
        setStatus('Помилка: ' + err.message, true);
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Спробувати ще';
    }
}

function renderSuccess() {
    const card = document.getElementById('card');
    card.innerHTML = `
        <div class="success">
            <div class="check">✅</div>
            <div class="msg">Збережено в «${selectedSection}»</div>
        </div>
    `;
    setTimeout(() => {
        window.close();
        setTimeout(() => { location.href = 'index.html'; }, 500);
    }, 2000);
}

/* ═══════════════════════════════════════════════════════════
   СТАРТ
   ═══════════════════════════════════════════════════════════ */

async function startAfterToken() {
    // Читаємо параметри
    videoUrl = getParam('url') || '';
    videoTitle = getParam('title') || '';

    const textParam = getParam('text') || '';
    if (textParam) {
        const match = textParam.match(/^(https?:\/\/[^\s]+)\s*(.*)$/);
        if (match) {
            if (!videoUrl) videoUrl = match[1];
            if (!videoTitle) videoTitle = match[2] || '';
        }
    }

    // Якщо URL немає — заглушка
    if (!videoUrl) {
        document.getElementById('card').innerHTML = `
            <h1 style="font-size:1.1rem;margin:0 0 12px;">Додати відео</h1>
            <p style="color: var(--muted); line-height: 1.5;">
                Ця сторінка призначена для додавання відео з YouTube.
                Скористайтесь кнопкою "Поділитися" на відео (телефон) або
                закладкою "📥 До каталогу" (ПК).
            </p>
        `;
        return;
    }

    // Якщо назви немає — отримуємо через noembed
    if (!videoTitle) {
        const vid = extractYouTubeId(videoUrl);
        if (vid) {
            const title = await fetchVideoTitle(vid);
            if (title) videoTitle = title;
        }
    }

    // Показуємо список альбомів
    renderAlbumsScreen();
}

document.addEventListener('DOMContentLoaded', () => {
    if (GitHubAPI.hasToken()) {
        GitHubAPI.checkToken().then(ok => {
            if (ok) startAfterToken();
            else renderTokenForm();
        });
    } else {
        renderTokenForm();
    }
});
</script>
</body>
</html>
